name: Update Trakt Graph

# ╔════════════════════════════════════════════════════════════════╗
# ║  CONFIGURATION - Edit these values for your Trakt profile      ║
# ╚════════════════════════════════════════════════════════════════╝
env:
  TRAKT_USERNAME: "TheLagacyMiner"     # Your Trakt username
  YEARS: "2026,2025"                           # Years to generate (e.g. "2025,2024" or leave empty for current)
  EXPORT_PNG: "false"                 # Set to "true" to also generate PNG files
  WEEK_START: "sunday"                # "sunday" or "monday"
  GRADIENT: "true"                    # "true" for colored name, "false" for white

# NOTE: Automatic triggers are disabled in this repository.
# Trakt only allows one API application per free account, and mine is used by
# another tool, so there is no valid TRAKT_API_KEY here and every scheduled run
# would fail. If you fork this repo, uncomment the schedule and push triggers.
on:
  # Daily at midnight UTC
  # schedule:
  #   - cron: "0 0 * * *"

  # On push to main
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'README.md'
  #     - 'LICENSE'
  #     - '.gitignore'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    env:
      TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Graphs
        run: |
          set -euo pipefail

          CMD=(node src/cli.js "${{ env.TRAKT_USERNAME }}" --all-variants -o images/github-trakt)

          if [ -n "${{ env.YEARS }}" ]; then CMD+=(-y "${{ env.YEARS }}"); fi
          if [ "${{ env.WEEK_START }}" = "monday" ]; then CMD+=(-w monday); fi
          if [ "${{ env.GRADIENT }}" = "false" ]; then CMD+=(-g false); fi
          if [ "${{ env.EXPORT_PNG }}" = "true" ]; then CMD+=(-p); fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all generated files
          git add images/
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Update Trakt graph - $TIMESTAMP"
            git push
          fi
